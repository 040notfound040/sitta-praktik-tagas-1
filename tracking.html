<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking Pengiriman - SITTA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracking">
<header id="navbar" class="navbar"></header>
<main>
  <section class="card">
    <h1>Tracking Pengiriman</h1>
    <form id="formCari" class="cari" novalidate>
      <label for="noDO" class="hidden">Nomor Delivery Order</label>
      <input type="text" id="noDO" placeholder="Nomor Delivery Order, mis. 2023001234" inputmode="numeric">
      <button class="btn" type="submit">Cari</button>
    </form>
    <span class="err" id="errDO" style="color:#c0392b"></span>
  </section>
  <section id="hasil" class="hidden" aria-live="polite">
    <article class="card">
      <div class="hasil-head">
        <h2 id="hNama" style="margin:0"></h2>
        <span>DO: <b id="hDO"></b></span> &nbsp; <span class="badge" id="hStatus"></span>
      </div>
      <div class="progress" aria-label="Progress pengiriman"><span id="bar"></span></div>
      <dl class="detail">
        <dt>Ekspedisi</dt><dd id="hEks"></dd>
        <dt>Tanggal kirim</dt><dd id="hTgl"></dd>
        <dt>Jenis paket</dt><dd id="hPaket"></dd>
        <dt>Total pembayaran</dt><dd id="hTotal"></dd>
      </dl>
    </article>
    <article class="card">
      <h2>Perjalanan Paket</h2>
      <ul class="timeline" id="timeline"></ul>
    </article>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
